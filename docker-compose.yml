# Local Redmine 6 for trying the plugin: docker compose up --build
# Then open http://localhost:3000 (admin / admin).
services:
  redmine:
    build: ./docker
    ports:
      - "3000:3000"
    environment:
      REDMINE_PLUGINS_MIGRATE: "1"
    volumes:
      - .:/usr/src/redmine/plugins/redmine_svn_authz
      - svn:/var/svn
volumes:
  svn:
