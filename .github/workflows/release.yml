name: Release package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the package for (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      # Only the files Redmine needs, in a directory named as Redmine expects
      - name: Build archives
        run: |
          name="redmine_svn_authz-${TAG}"
          files="init.rb app config db lib"
          git archive --format=tar.gz --prefix=redmine_svn_authz/ -o "$name.tar.gz" HEAD $files
          git archive --format=zip --prefix=redmine_svn_authz/ -o "$name.zip" HEAD $files
      - name: Upload to release
        run: gh release upload "$TAG" redmine_svn_authz-"$TAG".tar.gz redmine_svn_authz-"$TAG".zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
