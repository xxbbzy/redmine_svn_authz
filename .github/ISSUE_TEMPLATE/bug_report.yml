name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If a user can see content their authz rules should hide, please report it privately instead (see SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: authz
    attributes:
      label: authz rules
      description: The smallest set of rules that reproduces the problem. Replace real names with placeholders.
      render: ini
  - type: input
    id: redmine
    attributes:
      label: Redmine version
      placeholder: "6.1.5"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, MySQL / MariaDB, PostgreSQL, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: text
